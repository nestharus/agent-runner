[package]
name = "agent-runner-app"
version.workspace = true
edition.workspace = true

[lib]
name = "agent_runner_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oulipoly-agent-runner"
path = "src/main.rs"

[dependencies]
agent-runner-balancer.workspace = true
agent-runner-config.workspace = true
agent-runner-diagnostics.workspace = true
agent-runner-discovery.workspace = true
agent-runner-executor.workspace = true
agent-runner-quota.workspace = true
agent-runner-runtime.workspace = true
agent-runner-schema-probe.workspace = true
agent-runner-session.workspace = true
agent-runner-state.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
toml.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
sha2.workspace = true
tempfile.workspace = true
tauri = { version = "2", features = ["test"] }
