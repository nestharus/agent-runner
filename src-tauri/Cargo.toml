[package]
name = "oulipoly-agent-runner"
version.workspace = true
edition.workspace = true

[lib]
name = "agent_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oulipoly-agent-runner"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
oulipoly-config = { path = "../crates/oulipoly-config" }
oulipoly-core = { path = "../crates/oulipoly-core" }
oulipoly-runtime = { path = "../crates/oulipoly-runtime" }
oulipoly-setup = { path = "../crates/oulipoly-setup" }
oulipoly-state = { path = "../crates/oulipoly-state" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
regex.workspace = true
rusqlite.workspace = true
serde_yml.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints.clippy]
bool-assert-comparison = "allow"
filter-map-bool-then = "allow"
