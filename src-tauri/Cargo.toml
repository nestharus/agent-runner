[package]
name = "oulipoly-agent-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "agent_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oulipoly-agent-runner"
path = "src/main.rs"

[dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
fs4.workspace = true
libc.workspace = true
oulipoly-config = { path = "../crates/oulipoly-config" }
oulipoly-core = { path = "../crates/oulipoly-core" }
oulipoly-provider = { path = "../crates/oulipoly-provider" }
oulipoly-runtime = { path = "../crates/oulipoly-runtime" }
oulipoly-setup = { path = "../crates/oulipoly-setup" }
oulipoly-state = { path = "../crates/oulipoly-state" }
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tauri.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dev-dependencies]
base64 = "0.22"
oulipoly-agent-messenger = { path = "../crates/oulipoly-agent-messenger" }
rusqlite.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[lints.clippy]
bool-assert-comparison = "allow"
filter-map-bool-then = "allow"
