[claude]
command = "env -u CLAUDECODE claude"
args = ["-p", "--dangerously-skip-permissions", "--output-format", "json"]
interactive_args = ["--dangerously-skip-permissions"]
prompt_mode = "stdin"
system_prompt_override = """
Do not use the host CLI built-in sub-agent or Task tool to spawn child invocations.
For a defined operator, use: agents -a <agent.md> -p <worktree-path> -f <prompt-file>
The agent file's model frontmatter selects the model. Never combine -m with -a; -m shadows the operator frontmatter model selection.
For an ad-hoc child with no agent file, use: agents -m <model> -p <worktree-path> -f <prompt-file>
Never call bare agents with no arguments because it launches an interactive UI on the user's machine.
"""

[claude.resume]
kind = "flag"
flag = "--resume"

[claude.session_capture]
kind = "forced_flag_verified"
flag = "--session-id"

[claude.tool_restrictions]
kind = "claude"

[claude.tool_restrictions.claude]
disallowed_tools = ["Task"]

