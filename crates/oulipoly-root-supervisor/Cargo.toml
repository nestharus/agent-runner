[package]
name = "oulipoly-root-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Per-root supervisor process owning ACP v2 harness subprocesses, with per-root durable intent (Linux)"

[lib]
name = "oulipoly_root_supervisor"

[[bin]]
name = "oulipoly-root-supervisor"
path = "src/main.rs"

# Root PID 1 and per-work PID 1 of one root's PID namespace, started only by
# the supervisor (which finds it next to its own binary).
[[bin]]
name = "oulipoly-root-pid1"
path = "src/bin/root_pid1.rs"
test = false

# Prototype requester for a root's Bash ingress (see `bash` module docs):
# what a Bash entry inside a harness of this lineage does. Not the Bash tool.
[[bin]]
name = "oulipoly-root-bash"
path = "src/bin/root_bash.rs"

# Production Linux requester of a root's registered children (see `children`
# module docs), offered by the caller to a registered parent's explore bridge.
[[bin]]
name = "oulipoly-root-child"
path = "src/bin/root_child.rs"

# Deterministic ACP v2 peer used only as an owned harness in this crate's
# process-level tests. It is not a real harness.
[[bin]]
name = "oulipoly-acp-deterministic-peer"
path = "src/bin/deterministic_peer.rs"
test = false

[dependencies]
# Shared root control vocabulary (`session_control`): the owner speaks it at
# its control face. Declared versions/capabilities govern; the lock records
# the resolved source as provenance only.
agent-provider-contract = { git = "https://github.com/nestharus/agent-provider-sdk.git" }
libc.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
