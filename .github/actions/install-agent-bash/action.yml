name: Install pinned agent-bash
description: Install the agent-bash version required by wake integration tests
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Requires root/tree completion, explicit delivery, consume, and live owner attestation.
        cargo install --git https://github.com/nestharus/agent-bash-tool --rev 1e88d3e1d0af710d1476fdab1c105014406c28db --locked --root "$RUNNER_TEMP/agent-bash" agent-bash-tool
        echo "AGENT_BASH_BIN=$RUNNER_TEMP/agent-bash/bin/agent-bash" >> "$GITHUB_ENV"
