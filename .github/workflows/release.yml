name: Release

on:
  # Manual-only. Every push to main used to fire this workflow, which
  # meant merging a docs-only change or a small fix produced a new
  # release and shipped an unverified binary to consumers. Releases
  # are now gated on an explicit human trigger (Actions tab ->
  # "Release" -> "Run workflow"), decoupled from merge cadence. CI
  # (ci.yml) still runs on every PR for test/lint feedback.
  workflow_dispatch:
    inputs:
      reason:
        description: "Short note explaining why this release is being cut (shows up in the run's title)."
        required: false
        default: "manual release"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.gen.outputs.libs }}
      clients: ${{ steps.gen.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate matrix
        id: gen
        shell: bash
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          libs=$(echo "$metadata" | jq -c '[.packages[] | select(.manifest_path | test("/crates/")) | select(any(.targets[]; .kind | index("bin")) | not) | .name]')
          clients=$(echo "$metadata" | jq -c '[.packages[] | select(any(.targets[]; .kind | index("bin"))) | {name: .name}]')
          echo "libs=$libs" >> "$GITHUB_OUTPUT"
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Configure FontAwesome registry
        shell: bash
        run: |
          echo '@fortawesome:registry=https://npm.fontawesome.com/' >> .npmrc
          echo '//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_TOKEN }}' >> .npmrc
      - run: bun install
      - run: bun run check
      - run: bunx tsc --noEmit
      - run: bun run test

  rust-lib-check:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ${{ fromJSON(needs.prepare-matrix.outputs.libs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lib-${{ matrix.crate }}
      - run: cargo test -p ${{ matrix.crate }}
      - run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

  rust-client-check:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        client: ${{ fromJSON(needs.prepare-matrix.outputs.clients) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.client.name }}
      - if: runner.os == 'Linux' || runner.os == ''
        name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - if: matrix.client.name == 'oulipoly-agent-runner'
        name: Install pinned agent-bash
        uses: ./.github/actions/install-agent-bash
      - run: cargo test -p ${{ matrix.client.name }}
      - run: cargo clippy -p ${{ matrix.client.name }} -- -D warnings

  rust-integration:
    needs: [rust-lib-check, rust-client-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-integration
      - if: runner.os == 'Linux' || runner.os == ''
        name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Install pinned agent-bash
        uses: ./.github/actions/install-agent-bash
      - run: cargo test --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings

  version:
    needs: [rust-integration, frontend-check]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        id: resolve
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          resolved_version=$(echo "$metadata" | jq -r '.packages[] | select(.name == "oulipoly-agent-runner") | .version' | head -1)

          if ! [[ "$resolved_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Resolved oulipoly-agent-runner version is not semver X.Y.Z: $resolved_version"
            exit 1
          fi

          if git rev-parse "v${resolved_version}" >/dev/null 2>&1; then
            major=$(echo "$resolved_version" | cut -d. -f1)
            minor=$(echo "$resolved_version" | cut -d. -f2)
            highest_patch=$(git tag --list "v${major}.${minor}.*" | sed "s/v${major}\.${minor}\.//" | sort -n | tail -1)
            if [ -z "$highest_patch" ]; then
              highest_patch=0
            fi
            next_patch=$((highest_patch + 1))
            version="${major}.${minor}.${next_patch}"
          else
            version="$resolved_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Configure FontAwesome registry
        shell: bash
        run: |
          echo '@fortawesome:registry=https://npm.fontawesome.com/' >> .npmrc
          echo '//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_TOKEN }}' >> .npmrc
      - run: bun install
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: src-tauri
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build Tauri app
        run: bunx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/oulipoly-agent-runner artifacts/oulipoly-agent-runner-${{ matrix.target }} 2>/dev/null || true
      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/oulipoly-agent-runner artifacts/oulipoly-agent-runner-${{ matrix.target }} 2>/dev/null || true
      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe artifacts/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/oulipoly-agent-runner.exe artifacts/oulipoly-agent-runner-${{ matrix.target }}.exe -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: artifacts/*

  build-oulipoly-agent-store:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-store-${{ matrix.target }}
      - name: Build agent store
        run: cargo build --release --target ${{ matrix.target }} --bin agent-store -p oulipoly-agent-store
      - name: Collect agent store artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/agent-store artifacts/agent-store-${{ matrix.target }}
      - name: Collect agent store artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/agent-store.exe artifacts/agent-store-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-store-${{ matrix.target }}
          path: artifacts/*

  build-oulipoly-agent-scratchpad:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-scratchpad-${{ matrix.target }}
      - name: Build agent scratchpad
        run: cargo build --release --target ${{ matrix.target }} --bin agent-scratchpad -p oulipoly-agent-scratchpad
      - name: Collect agent scratchpad artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/agent-scratchpad artifacts/agent-scratchpad-${{ matrix.target }}
      - name: Collect agent scratchpad artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/agent-scratchpad.exe artifacts/agent-scratchpad-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-scratchpad-${{ matrix.target }}
          path: artifacts/*

  build-oulipoly-agent-messenger:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-messenger-${{ matrix.target }}
      - name: Build agent messenger
        run: cargo build --release --target ${{ matrix.target }} --bin agent-messenger -p oulipoly-agent-messenger
      - name: Collect agent messenger artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/${{ matrix.target }}/release/agent-messenger artifacts/agent-messenger-${{ matrix.target }}
      - name: Collect agent messenger artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item src-tauri/target/${{ matrix.target }}/release/agent-messenger.exe artifacts/agent-messenger-${{ matrix.target }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-messenger-${{ matrix.target }}
          path: artifacts/*

  release:
    needs: [version, build, build-oulipoly-agent-store, build-oulipoly-agent-scratchpad, build-oulipoly-agent-messenger]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - name: Create tag
        run: |
          git tag ${{ needs.version.outputs.tag }}
          git push origin ${{ needs.version.outputs.tag }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/*
            scripts/claude-code-turns
            scripts/codex-turns
            scripts/anthropic-usage
            scripts/chatgpt-usage
            scripts/zai-usage
            scripts/claude-code-locate-transcript
            scripts/codex-locate-transcript
            scripts/claude-code-cwd
            scripts/codex-cwd
