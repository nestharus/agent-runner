name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  TERM: xterm-256color
  OULIPOLY_DATA_DIR: ${{ github.workspace }}/target/ci-data
  OULIPOLY_DATA_HOME: ${{ github.workspace }}/target/ci-data-home
  XDG_CONFIG_HOME: ${{ github.workspace }}/target/ci-config-home
  XDG_DATA_HOME: ${{ github.workspace }}/target/ci-xdg-data
  XDG_CACHE_HOME: ${{ github.workspace }}/target/ci-cache

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      libs: ${{ steps.gen.outputs.libs }}
      clients: ${{ steps.gen.outputs.clients }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate matrix
        id: gen
        shell: bash
        run: |
          metadata=$(cargo metadata --format-version 1 --no-deps)
          libs=$(echo "$metadata" | jq -c '[.packages[] | select(.manifest_path | test("/crates/")) | select(any(.targets[]; .kind | index("bin")) | not) | .name]')
          clients=$(echo "$metadata" | jq -c '[.packages[] | select(any(.targets[]; .kind | index("bin"))) | {name: .name}]')
          echo "libs=$libs" >> "$GITHUB_OUTPUT"
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Configure FontAwesome registry
        shell: bash
        run: |
          echo '@fortawesome:registry=https://npm.fontawesome.com/' >> .npmrc
          echo '//npm.fontawesome.com/:_authToken=${{ secrets.FONTAWESOME_NPM_TOKEN }}' >> .npmrc
      - run: bun install
      - run: bun run check
      - run: bunx tsc --noEmit
      - run: bun run test

  rust-lib-check:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.prepare-matrix.outputs.libs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: lib-${{ matrix.crate }}
      - name: Install executable test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep util-linux ncurses-bin
      - run: rg --version && script --version && command -v tput
      - name: Package tests (retain every target outcome)
        timeout-minutes: 30
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: bash ${{ github.workspace }}/.github/scripts/ci-test-runner.sh
        run: cargo test -p ${{ matrix.crate }} --no-fail-fast
      - if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo clippy -p ${{ matrix.crate }} -- -D warnings

  rust-client-check:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.prepare-matrix.outputs.clients) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-${{ matrix.client.name }}
      - if: runner.os == 'Linux'
        name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev ripgrep util-linux ncurses-bin
      - if: matrix.client.name == 'oulipoly-agent-runner'
        name: Install pinned agent-bash
        uses: ./.github/actions/install-agent-bash
      - run: rg --version && script --version && command -v tput
      - name: Package tests (retain every target outcome)
        timeout-minutes: 45
        run: cargo test -p ${{ matrix.client.name }} --no-fail-fast
      - if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo clippy -p ${{ matrix.client.name }} -- -D warnings

  rust-state-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: state-windows
      - timeout-minutes: 20
        run: cargo test -p oulipoly-state read_only_snapshot -- --nocapture
      - if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p oulipoly-state pid_identity::tests

  rust-state-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: state-macos
      - timeout-minutes: 20
        run: cargo test -p oulipoly-state read_only_snapshot -- --nocapture
      - if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test -p oulipoly-state pid_identity::tests

  rust-native-wake:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-wake-${{ runner.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - timeout-minutes: 30
        run: cargo test -p oulipoly-agent-runner --test age330_native_delivery_domain -- --nocapture
      - if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p oulipoly-agent-runner --lib wake_coordinator::admission::tests::native_memory_observer_matches_host_and_drives_default_admission -- --exact --nocapture
      - if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p oulipoly-agent-runner --lib wake_coordinator::admission::tests::unavailable_memory_observation_returns_visible_error_without_stranding_queue -- --exact
      - if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo test -p oulipoly-agent-runner --test age309_native_wake_domain native_count_five_startup_sweep_reaches_one_detached_provider_turn -- --exact --nocapture

  rust-integration:
    if: ${{ !cancelled() }}
    needs: [rust-lib-check, rust-client-check, rust-state-windows, rust-state-macos, rust-native-wake]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: rust-integration
      - if: runner.os == 'Linux'
        name: Install system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev ripgrep util-linux ncurses-bin
      - name: Install pinned agent-bash
        uses: ./.github/actions/install-agent-bash
      - run: rg --version && script --version && command -v tput
      - name: Workspace tests (retain every target outcome)
        timeout-minutes: 60
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: bash ${{ github.workspace }}/.github/scripts/ci-test-runner.sh
        run: cargo test --workspace --no-fail-fast
      - if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: cargo fmt --all -- --check
      - if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: cargo clippy --workspace -- -D warnings
